name: QQ 群发图

# 只手动触发：仓库 Actions 页面点 “Run workflow”
on:
  workflow_dispatch:
    inputs:
      job:
        description: '要发的目录名（jobs/ 下的名字，可填前缀；留空=全部待发）'
        required: false
        default: ''
      limit:
        description: '最多发几个目录（留空=不限）'
        required: false
        default: ''
      archive:
        description: '发完把目录归档到 jobs/_sent'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: qqbot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 列出待发目录
        id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_FILTER: ${{ inputs.job }}
          JOB_LIMIT: ${{ inputs.limit }}
        run: |
          python3 tools/list_jobs.py | python3 tools/trim_jobs.py
          echo "count=$(python3 -c "import json;print(len(json.load(open('jobs.json'))))")" >> "$GITHUB_OUTPUT"

      - name: 逐个发送
        if: steps.pick.outputs.count != '0'
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: |
          set -e
          for job in $(python3 -c "import json;print(' '.join(json.load(open('jobs.json'))))"); do
            echo "::group::发送 $job"
            python3 tools/qqbot_group_send.py --job "jobs/$job"
            echo "$job" >> sent.txt
            echo "::endgroup::"
            sleep 15
          done

      - name: 归档已发送目录
        if: steps.pick.outputs.count != '0' && inputs.archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f sent.txt ] || exit 0
          slot=$(date -u +%Y%m%d-%H%M%S)
          while read -r job; do
            [ -n "$job" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/jobs/$job" \
              -f message="chore(jobs): 归档 $slot/$job" -f branch="${GITHUB_REF_NAME}" \
              && echo "已归档 jobs/$job"
          done < sent.txt
